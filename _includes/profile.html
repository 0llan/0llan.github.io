<figure class="about-figure" data-about-slideshow role="region" aria-roledescription="carousel" aria-label="Profile photos">
    <a class="about-slides" href="images/img-profile/about_1.png" aria-label="Enlarge current profile photo" aria-haspopup="dialog">
        <img class="about-slide is-active" src="images/img-profile/about_1.png" alt="Semoo Shin flying a helicopter outdoors" loading="lazy" decoding="async">
        <img class="about-slide" src="images/img-profile/about_2.jpg" alt="Semoo Shin beneath cherry blossoms on the GIST campus" loading="lazy" decoding="async" aria-hidden="true">
        <img class="about-slide" src="images/img-profile/about_3.png" alt="Semoo Shin on a city street at night" loading="lazy" decoding="async" aria-hidden="true">
    </a>
    <dialog class="about-lightbox" aria-label="Profile photo viewer">
        <button class="about-lightbox-close" type="button" aria-label="Close photo viewer" autofocus>×</button>
        <button class="about-lightbox-prev" type="button" aria-label="Previous photo">‹</button>
        <img class="about-lightbox-image" alt="">
        <button class="about-lightbox-next" type="button" aria-label="Next photo">›</button>
    </dialog>
</figure>
